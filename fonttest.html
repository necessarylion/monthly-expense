<html><body style="margin:0">
<div id="out" style="font:14px monospace;white-space:pre"></div>
<script>
const vals = [100, 87.5, 75, 62.5, 50, 40, 30];
const stacks = {
  'apple': '-apple-system, sans-serif',
  'system-ui': 'system-ui, sans-serif',
  'SFPro': '"SF Pro Display", sans-serif',
};
let lines = [];
for (const [label, ff] of Object.entries(stacks)) {
  let row = [label.padEnd(10)];
  for (const v of vals) {
    const s = document.createElement('span');
    s.style.cssText = `position:absolute;font-family:${ff};font-size:100px;font-weight:900;font-stretch:${v}%;font-variant-numeric:tabular-nums`;
    s.textContent = '8,577.50';
    document.body.appendChild(s);
    row.push((v + '%=' + s.getBoundingClientRect().width.toFixed(1)).padEnd(14));
    s.remove();
  }
  lines.push(row.join(''));
}
// also variation-settings direct
for (const w of [100, 60, 40, 30]) {
  const s = document.createElement('span');
  s.style.cssText = `position:absolute;font-family:-apple-system;font-size:100px;font-weight:900;font-variation-settings:'wdth' ${w}`;
  s.textContent = '8,577.50';
  document.body.appendChild(s);
  lines.push(`varset wdth ${w} = ${s.getBoundingClientRect().width.toFixed(1)}`);
  s.remove();
}
document.title = 'DONE';
document.getElementById('out').textContent = lines.join('\n');
</script></body></html>
