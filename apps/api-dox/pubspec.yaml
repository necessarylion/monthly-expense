name: api_dox
description: The monthly-expense API on the Dox framework.
publish_to: 'none'

environment:
  sdk: ^3.13.0

dependencies:
  dox_core: ^3.1.2
  dox_orm: ^3.1.0
  dox_migration: ^3.1.0
  dox_mcp: ^3.1.2
  dox_socketio: ^3.1.1
  firebase_admin_sdk: 0.5.6
  http: ^1.6.0
  mime: ^2.0.0
  path: ^1.9.0
  dox_scheduler: ^3.1.0
  pointycastle: ^4.0.0

dev_dependencies:
  crypto: ^3.0.6
  dox_builder: ^3.1.2
  build_runner: ^2.4.13
  lints: ^6.1.0
  socket_io_client: ^3.1.6
  test: ^1.26.3

hooks:
  user_defines:
    # The app uses SQLite or Postgres, never MySQL: skip that download.
    dox_mysql_native:
      skip: true
