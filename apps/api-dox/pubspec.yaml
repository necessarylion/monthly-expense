name: api_dox
description: The monthly-expense API on the Dox framework.
publish_to: 'none'

environment:
  sdk: ^3.13.0

dependencies:
  dox_core: ^3.2.5
  dox_orm: ^3.2.3
  dox_auth: ^3.2.2
  dox_migration: ^3.2.3
  dox_mcp: ^3.2.2
  dox_socketio: ^3.2.2
  firebase_admin_sdk: 0.5.6
  dox_http_client: ^0.0.4
  mime: ^2.0.0
  path: ^1.9.0
  dox_scheduler: ^3.2.2
  # dox_core already uses these three. They are listed here so that
  # `dart run skills@ get` installs their skills too.
  dox_cache: ^3.2.2
  dox_validation: ^3.2.1
  dox_openapi: ^3.2.1
  pointycastle: ^4.0.0
  crypto: ^3.0.6

dev_dependencies:
  dox_builder: ^3.2.2
  build_runner: ^2.4.13
  lints: ^6.1.0
  socket_io_client: ^3.1.6
  test: ^1.26.3

hooks:
  user_defines:
    # The app uses SQLite or Postgres, never MySQL: skip that download.
    dox_mysql_native:
      skip: true
