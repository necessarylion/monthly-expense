<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- Opens full screen (no browser bar) when added to the home screen. No service worker on purpose. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Expense" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#fcfbf8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a1714" media="(prefers-color-scheme: dark)" />
    <title>Monthly Expense</title>
    <script>
      // Set the theme before the first paint, so dark mode never flashes white.
      try {
        var pref = localStorage.getItem('app:theme') || 'system'
        var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        if (dark) document.documentElement.classList.add('dark')
        if (pref === 'pink') document.documentElement.classList.add('pink')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Firebase config from the API env, so one build works with any Firebase project. -->
    <script src="/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
